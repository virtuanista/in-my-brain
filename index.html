<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>In My Brain</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23b08d57'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23fff8ec'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23241a10'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <!-- capa de etiquetas (la mente humana nombra las cosas) -->
  <div id="labels"></div>
  <!-- vaho del cristal: se dibuja en este canvas y se usa como textura -->
  <canvas id="fogCanvas" width="512" height="512" hidden></canvas>

  <!-- pantalla de carga / título -->
  <section id="intro" class="screen">
    <div class="intro-inner">
      <h1 class="logo"><span>In</span> <em>My</em> <span>Brain</span></h1>
      <div class="progress"><div class="bar" id="loadBar"></div></div>
      <p class="load-label" id="loadLabel">Cargando…</p>
      <p class="hint">Mejor con cascos</p>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-who">
        <span class="hud-kicker" id="hudKicker">Espíritu</span>
        <span class="hud-name" id="hudName">Sin cuerpo</span>
      </div>
      <div class="hud-clock">
        <span id="hudTime">07:14:00</span>
        <span class="hud-scale" id="hudScale">tiempo ×1</span>
      </div>
    </div>
    <div class="thought" id="thought"></div>
    <div class="meter" id="meter" hidden><span id="meterLabel"></span><div class="meter-track"><div class="meter-fill" id="meterFill"></div></div></div>
    <div class="prompt" id="prompt" hidden></div>
    <div class="hud-bottom">
      <div class="controls" id="controls"></div>
      <button class="btn-ghost" id="openPicker"><kbd>Tab</kbd> Cambiar</button>
    </div>
    <div class="crosshair" id="crosshair"></div>
    <div class="hover-name" id="hoverName"></div>
  </div>

  <!-- mazo de cartas: una mente por carta -->
  <section id="picker" class="deck" hidden>
    <header class="deck-head">
      <h1 class="deck-logo"><span>In</span> <em>My</em> <span>Brain</span></h1>
      <p class="deck-title">¿Y si pudieras ver el mundo desde otra cabeza?</p>
      <p class="deck-sub">Elige algo de la cocina y métete dentro</p>
    </header>
    <div class="deck-stage" id="deckStage"></div>
    <div class="deck-bar">
      <button class="deck-arrow" id="deckPrev" aria-label="Anterior">←</button>
      <span class="deck-count" id="deckCount">1 / 34</span>
      <button class="deck-arrow" id="deckNext" aria-label="Siguiente">→</button>
    </div>
    <p class="deck-hint">Arrastra o usa las flechas · <kbd>Enter</kbd> para entrar</p>
    <button class="btn-ghost deck-back" id="deckBack" hidden><kbd>Esc</kbd> Volver</button>
  </section>

  <div id="fade"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
